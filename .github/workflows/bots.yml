name: Paper bots

# Three paper trading bots (scripts/bots.mjs): Schwab-tradable stocks and ETFs, limit entries, 5–30 minute holds.
# A run checks the market every minute and pushes bots.json to the "bots" branch (the dashboard reads it).
# A job lasts at most 6 hours, so a market day has two runs: one starts before the open, one at about 2:50 PM ET
# (EST; 1:50 PM in summer) and runs to the close. Only one run works at a time; the next waits in the queue.
# On a push of the bot script, or when the market is closed, it only replays the last 7 days (the bots learn).
# Since Nov 8 2026 each run starts the next one (scripts/bots.mjs relay()): the schedule alone started the first run of
# the day at about 2:55 PM ET, so the bots traded only the last hour. A closed-market run sleeps until 20 min before the open.
on:
  schedule:
    - cron: "5 13 * * 1-5"
    - cron: "50 18 * * 1-5"
    - cron: "*/30 13-21 * * 1-5"   # a back-up: GitHub can start scheduled runs late or skip them; extra runs wait in the queue or are cancelled
  push:
    branches: [main]
    paths: ["scripts/bots.mjs", ".github/workflows/bots.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # a run starts the next run (workflow_dispatch): GitHub's schedule starts runs hours late

concurrency:
  group: bots
  cancel-in-progress: false

jobs:
  bots:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get the bots' memory from the bots branch
        run: |
          mkdir -p out && cd out && git init -q -b bots
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" bots 2>/dev/null; then git checkout -q FETCH_HEAD -- . && git reset -q --soft FETCH_HEAD 2>/dev/null || true; fi
          ls -la
      - name: Run the bots
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          MAX_MIN: "340"
          NEXT_FILE: ${{ runner.temp }}/next-run
        run: node scripts/bots.mjs out auto
      - name: Start the next run (the relay)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "${{ runner.temp }}/next-run" ]; then
            cat "${{ runner.temp }}/next-run"
            gh workflow run bots.yml --repo "${GITHUB_REPOSITORY}" --ref main || echo "dispatch failed: the schedule is the back-up"
          else echo "no next run asked"; fi
