<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mastermind Investor</title>
<meta name="description" content="Ask about any trade: a thesis and the points that matter, from Hyperdash cohorts, the spider web and every tested engine of SOXX Sniper, Cohort Sniper and LETF Sniper.">
<link rel="icon" href="../favicon.svg?v=1" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("soxx_theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#07090d;--panel:#0e131b;--panel2:#131a24;--line:#1e2835;--ink:#e6edf5;--dim:#8a97a8;--mute:#5a6676;--up:#19d38a;--down:#ff4d5e;--accent:#4da3ff;--amber:#ffb547;--violet:#9b6bff;
  --bull:var(--up);--bear:var(--down);--faint:var(--dim);--mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Space Grotesk',system-ui,sans-serif}
:root[data-theme=light]{--bg:#f3f5f9;--panel:#ffffff;--panel2:#f1f4f9;--line:#dce2eb;--ink:#0f1726;--dim:#55606f;--mute:#8a94a3;--up:#0b9e65;--down:#e1354a;--accent:#2463eb;--amber:#b86e00;--violet:#6d44f0}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--violet),var(--accent));display:grid;place-items:center;font:700 15px var(--mono);color:#fff}
h1{font-size:21px;margin:0;letter-spacing:.2px}.sub{font-size:12.5px;color:var(--dim)}
.links{display:flex;gap:8px;flex-wrap:wrap}.links a,button{font:12px var(--mono);color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 11px;text-decoration:none;cursor:pointer}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.label{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.search{display:flex;gap:8px}.search input{flex:1;font:16px var(--sans);padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent)}.search button{font-size:14px;padding:0 18px;background:var(--accent);border-color:var(--accent);color:#fff;border-radius:12px}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.ex button{font-size:11.5px;padding:4px 10px;color:var(--dim)}
.verdict{font:700 20px var(--sans);margin:2px 0 6px}.thesis{font-size:15px;line-height:1.55}
.pts{margin:8px 0 0;padding-left:20px;line-height:1.55;font-size:14px}.pts li{margin:3px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font:12px var(--mono)}th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--dim);font-weight:600}td.l,th.l{text-align:left}
.L{color:var(--up)}.S{color:var(--down)}.A{color:var(--amber)}.note{font-size:12px;color:var(--dim);margin:6px 0;line-height:1.45}
.ev{display:grid;grid-template-columns:1fr 70px 1fr;gap:4px 8px;align-items:center;font-size:12.5px}.ev .bar{height:8px;border-radius:4px;background:var(--line);position:relative}.ev .bar i{position:absolute;top:0;height:8px;border-radius:4px}
.tw{overflow-x:auto}.chip{display:inline-block;font:11px var(--mono);border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin:0 4px 4px 0;color:var(--dim)}
@media(max-width:640px){.grid{grid-template-columns:1fr}.verdict{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo">MI</div><div><h1>Mastermind Investor</h1><div class="sub">Ask about any trade · one answer from every tracker, cohort and test</div></div></div>
    <div class="links"><a href="../">SOXX Sniper</a><a href="https://stevenwsharp-ctrl.github.io/Hyperdash-Cohort-Tracker/">Cohort Sniper</a><a href="https://stevenwsharp-ctrl.github.io/LETF-Sniper/">LETF Sniper</a><button id="themeBtn">☾</button></div>
  </header>
  <section class="card">
    <form class="search" id="q"><input id="qi" autocomplete="off" placeholder='Ask anything: "I am about to go long on BE", "short HYPE for the weekend?", "NVDA swing"'><button>Ask</button></form>
    <div class="ex" id="qex"></div>
  </section>
  <div id="ans"></div>
  <div id="home"></div>
</div>
<script src="../tax.js?v=1"></script>
<script src="../web.js?v=19"></script>
<script src="../hub.js?v=2"></script>
<script src="../agree.js?v=3"></script>
<script src="../idx.js?v=2"></script>
<script src="../shock.js?v=1"></script>
<script src="../trapped.js?v=1"></script>
<script src="../vflow.js?v=1"></script>
<script src="../pb.js?v=1"></script>
<script src="../markov.js?v=2"></script>
<script src="../matrix.js?v=2"></script>
<script src="../rollover.js?v=2"></script>
<script src="../planner.js?v=4"></script>
<script src="mm.js?v=4"></script>
</body>
</html>
